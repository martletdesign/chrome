name: Verify Martlet chrome
on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
    tags: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm test
      - run: git diff --exit-code
      - uses: actions/upload-artifact@v4
        with:
          name: martlet-chrome
          path: dist/
          retention-days: 7
